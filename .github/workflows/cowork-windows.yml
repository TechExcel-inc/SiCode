name: cowork-windows

# Builds the unsigned EAD SiCode Windows installer (NSIS, x64) on a GitHub-hosted runner.
# Starts when a `cowork-v*` tag is pushed (or by hand from the Actions tab); the .exe is attached
# to the run as the "kloud-cowork-windows" artifact.
#
# The EAD MCP server comes from the private EAD_PFM-Editor repo. Its built `dist` and package
# files are kept in packages/desktop/build-inputs/mcp-eadpfm.zip (refresh it when the MCP server
# changes), and its npm dependencies are installed here.

on:
  push:
    tags:
      - "cowork-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: cowork-${{ env.TARGET }}

      - name: Unpack the EAD MCP server
        shell: bash
        run: |
          dir="$GITHUB_WORKSPACE/../EAD_PFM-Editor/mcp-eadpfm"
          mkdir -p "$dir"
          unzip -q packages/desktop/build-inputs/mcp-eadpfm.zip -d "$dir"
          cd "$dir"
          npm ci --omit=dev --no-audit --no-fund
          test -f dist/index.js

      - name: Build the sidecar
        shell: bash
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: latest
          RUST_TARGET: ${{ env.TARGET }}
          TAURI_ENV_TARGET_TRIPLE: ${{ env.TARGET }}
          OPENCODE_REBUILD_SIDECAR: "1"
          OPENCODE_SKIP_INSTALL: "1"
        run: |
          export OPENCODE_VERSION="$(node -p "require('./package.json').version")"
          echo "version $OPENCODE_VERSION"
          bun ./scripts/predev.ts
          grep -aq sicode "src-tauri/sidecars/opencode-cli-$TARGET.exe"

      - name: Build the installer
        shell: bash
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: latest
          RUST_TARGET: ${{ env.TARGET }}
        run: |
          export OPENCODE_VERSION="$(node -p "require('./package.json').version")"
          bun run tauri build --target "$TARGET" --config ./src-tauri/tauri.unsigned.conf.json --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: kloud-cowork-windows
          path: packages/desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
